services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: compras_paraguai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/compras_paraguai
      PORT: 3000
      CRON_SCHEDULE: "0 */6 * * *"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
