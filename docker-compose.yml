services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: compras_paraguai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      - LOG_LEVEL=info
      - TZ=America/Sao_Paulo
      - HEADLESS=true
    ports:
      - "8191:8191"
    restart: unless-stopped

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/compras_paraguai
      PORT: 3000
      CRON_SCHEDULE: "0 */6 * * *"
      FLARESOLVERR_URL: http://flaresolverr:8191/v1
    depends_on:
      - db
      - flaresolverr
    restart: unless-stopped

volumes:
  pgdata:
