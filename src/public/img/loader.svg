<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <clipPath id="lens">
      <circle cx="48" cy="48" r="34"/>
    </clipPath>
  </defs>
  <!-- Lupa girando -->
  <g transform-origin="48 48">
    <animateTransform attributeName="transform" type="rotate" from="0 48 48" to="360 48 48" dur="2.5s" repeatCount="indefinite"/>
    <!-- Aro da lupa -->
    <circle cx="48" cy="48" r="38" fill="none" stroke="#1a3d7c" stroke-width="6"/>
    <circle cx="48" cy="48" r="38" fill="none" stroke="#2d7ff9" stroke-width="3" stroke-dasharray="60 180" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 48 48" to="-360 48 48" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Cabo da lupa -->
    <line x1="74" y1="74" x2="100" y2="100" stroke="#1a3d7c" stroke-width="8" stroke-linecap="round"/>
    <line x1="76" y1="76" x2="98" y2="98" stroke="#2d5ca6" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Bandeira do Paraguai (fixa, dentro da lupa) -->
  <g clip-path="url(#lens)">
    <!-- Faixa vermelha -->
    <rect x="14" y="14" width="68" height="23" fill="#d32f2f"/>
    <!-- Faixa branca -->
    <rect x="14" y="37" width="68" height="22" fill="#ffffff"/>
    <!-- Faixa azul -->
    <rect x="14" y="59" width="68" height="23" fill="#1565c0"/>
    <!-- Brasão central simplificado -->
    <circle cx="48" cy="48" r="9" fill="none" stroke="#2e7d32" stroke-width="2"/>
    <circle cx="48" cy="48" r="5" fill="#f9a825"/>
    <path d="M48 44l1.5 3 3.5.5-2.5 2.5.5 3.5L48 52l-3 1.5.5-3.5L43 47.5l3.5-.5z" fill="#d32f2f" transform="scale(0.7) translate(20.5 20.5)"/>
  </g>
</svg>
